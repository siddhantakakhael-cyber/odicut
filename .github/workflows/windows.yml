name: Windows EXE

on:
  push:
    branches: ["arena/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch OpenCode Windows binary
        run: python scripts/fetch_opencode.py --pkg opencode-windows-x64 --dest vendor/opencode.exe

      - name: Build EXE (PyInstaller)
        run: pyinstaller ochub.spec --noconfirm --clean

      - name: Smoke test the EXE
        shell: pwsh
        run: |
          $exe = "dist/OpenCodeHub/OpenCodeHub.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--server-only","--port","8799" -PassThru
          $health = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod "http://127.0.0.1:8799/api/health"
              if ($r.ok) { $health = $true; break }
            } catch {}
          }
          # verify the bundled OpenCode binary actually boots in the background
          $running = $false
          if ($health) {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $s = Invoke-RestMethod "http://127.0.0.1:8799/api/state"
                if ($s.running) { $running = $true; break }
              } catch {}
            }
          }
          $log = Get-Content "$env:APPDATA/OpenCodeHub/hub.log" -Tail 80 -ErrorAction SilentlyContinue
          $report = @()
          $report += "health_ok=$health"
          $report += "opencode_running=$running"
          $report += "exe_exists=$(Test-Path $exe)"
          $report += "---- hub.log (tail) ----"
          $report += $log
          $report | Set-Content -Path ci-smoke-result.txt -Encoding utf8
          Write-Host ($report -join "`n")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $health) { Write-Host "FAIL: app health"; exit 1 }
          if (-not $running) { Write-Host "FAIL: bundled OpenCode did not boot"; exit 1 }

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenCodeHub/* -DestinationPath OpenCodeHub-windows-x64.zip
          $mb = [math]::Round((Get-Item OpenCodeHub-windows-x64.zip).Length / 1MB, 1)
          Write-Host "Artifact: OpenCodeHub-windows-x64.zip ($mb MB)"
          Add-Content -Path ci-smoke-result.txt -Value "artifact_mb=$mb"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodeHub-windows-x64
          path: OpenCodeHub-windows-x64.zip
          if-no-files-found: error

      - name: Record smoke result back to repo
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci-smoke-result.txt) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ci-smoke-result.txt
            git commit -m "CI: Windows exe smoke result [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
